<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Document Vault</title>
    <style>
        /* ==========================================
           1. GLOBAL & RESET STYLES
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            min-height: 100vh;
        }

        /* ==========================================
           2. AUTHENTICATION STYLES
           ========================================== */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .auth-box h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #2c3e50;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #666;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #3498db;
        }

        .alert-message {
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        .toggle-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .toggle-text a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        /* ==========================================
           3. DASHBOARD STYLES
           ========================================== */
        .dashboard-container {
            display: none;
        }

        .navbar {
            background-color: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-badge {
            background-color: #f1c40f;
            color: #000;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 8px;
        }

        .logout-btn {
            background-color: #e74c3c;
            padding: 8px 15px;
            font-size: 14px;
            width: auto;
        }

        .logout-btn:hover {
            background-color: #c0392b;
        }

        .main-content {
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .action-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .action-card {
            flex: 1;
            min-width: 250px;
        }

        .action-card h4 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .action-card input, .action-card select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .section-title {
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .folders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .folder-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #3498db;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .folder-card:hover {
            transform: translateY(-3px);
        }

        .folder-card h3 {
            font-size: 16px;
            color: #333;
        }

        .files-list {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .view-btn {
            padding: 6px 12px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
        }

        .view-btn:hover {
            background: #219150;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ==========================================
         SECTION 1: AUTHENTICATION (LOGIN & REGISTER)
         ========================================== -->
    <div class="auth-container" id="authSection">
        
        <!-- Login Form -->
        <div class="auth-box" id="loginBox">
            <h2>User / Admin Login</h2>
            
            <div id="loginAlert" class="alert-message alert-error"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" required placeholder="Enter username">
                </div>
                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn" id="loginBtn">Login</button>
            </form>
            <p class="toggle-text">
                New user? <a onclick="toggleAuth('register')">Register here</a>
            </p>
        </div>

        <!-- Register Form -->
        <div class="auth-box hidden" id="registerBox">
            <h2>New User Registration</h2>
            
            <div id="regAlert" class="alert-message"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" required placeholder="Enter full name">
                </div>
                <div class="input-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" required placeholder="Enter email address">
                </div>
                <div class="input-group">
                    <label for="regUsername">Choose Username</label>
                    <input type="text" id="regUsername" required placeholder="Choose a unique username">
                </div>
                <div class="input-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required placeholder="Create password">
                </div>
                <button type="submit" class="btn" id="regBtn">Register</button>
            </form>
            <p class="toggle-text">
                Already have an account? <a onclick="toggleAuth('login')">Login here</a>
            </p>
        </div>

    </div>

    <!-- ==========================================
         SECTION 2: USER DASHBOARD
         ========================================== -->
    <div class="dashboard-container" id="dashboardSection">
        
        <!-- Navbar -->
        <nav class="navbar">
            <h2>Document Vault</h2>
            <div>
                <span id="userNameDisplay">Welcome, User</span>
                <span id="adminBadge" class="admin-badge hidden">ADMIN</span> | 
                <button class="btn logout-btn" onclick="handleLogout()">Logout</button>
            </div>
        </nav>

        <div class="main-content">
            
            <!-- Actions Section: Create Folder & Upload File -->
            <div class="action-bar">
                
                <!-- Create Folder Form -->
                <div class="action-card">
                    <h4>Create New Folder</h4>
                    <input type="text" id="newFolderName" placeholder="Folder Name (e.g., Marksheet)">
                    <button class="btn" id="createFolderBtn" onclick="createFolder()">Create Folder</button>
                </div>

                <!-- Upload Document Form -->
                <div class="action-card">
                    <h4>Upload New Document</h4>
                    <select id="folderSelect">
                        <option value="">Select Target Folder</option>
                    </select>
                    <input type="file" id="fileInput">
                    <button class="btn" id="uploadFileBtn" onclick="uploadFile()">Upload File</button>
                </div>

            </div>

            <!-- Folders Display Grid -->
            <h3 class="section-title">My Folders</h3>
            <div class="folders-grid" id="foldersContainer">
                <p>No folders created yet.</p>
            </div>

            <!-- Uploaded Files Display Section -->
            <h3 class="section-title">Recent Documents</h3>
            <div class="files-list" id="filesContainer">
                <p>No documents uploaded yet.</p>
            </div>

        </div>
    </div>

    <!-- ==========================================
         JAVASCRIPT LOGIC
         ========================================== -->
    <script>
        // Paste your Web App URL from Google Apps Script here
        const API_URL = "YOUR_DEPLOYED_WEB_APP_URL_HERE"; 

        let currentUsername = "";

        function showAlert(elementId, message, type = 'error') {
            const alertBox = document.getElementById(elementId);
            alertBox.innerText = message;
            alertBox.className = `alert-message ${type === 'error' ? 'alert-error' : 'alert-success'}`;
            alertBox.style.display = 'block';
        }

        function hideAlerts() {
            document.getElementById('loginAlert').style.display = 'none';
            document.getElementById('regAlert').style.display = 'none';
        }

        function toggleAuth(view) {
            hideAlerts();
            const loginBox = document.getElementById('loginBox');
            const registerBox = document.getElementById('registerBox');

            if (view === 'register') {
                loginBox.classList.add('hidden');
                registerBox.classList.remove('hidden');
            } else {
                registerBox.classList.add('hidden');
                loginBox.classList.remove('hidden');
            }
        }

        // Registration Handler
        async function handleRegister(event) {
            event.preventDefault();
            hideAlerts();

            const fullName = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const regBtn = document.getElementById('regBtn');

            if (username.toLowerCase() === "admin") {
                showAlert('regAlert', "The username 'Admin' is reserved. Please choose another username.");
                return;
            }

            regBtn.disabled = true;
            regBtn.innerText = "Registering...";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "register",
                        fullName: fullName,
                        email: email,
                        username: username,
                        password: password
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showAlert('regAlert', "Registration successful! Redirecting to login...", 'success');
                    document.getElementById('registerForm').reset();
                    setTimeout(() => toggleAuth('login'), 2000);
                } else {
                    showAlert('regAlert', result.message || "Registration failed.");
                }
            } catch (err) {
                showAlert('regAlert', "Network error or API not connected.");
            } finally {
                regBtn.disabled = false;
                regBtn.innerText = "Register";
            }
        }

        // Login Handler
        async function handleLogin(event) {
            event.preventDefault();
            hideAlerts();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            const adminBadge = document.getElementById('adminBadge');

            // Hardcoded Admin Credentials
            if (username === "Admin" && password === "Kookie@2207") {
                currentUsername = "Admin";
                adminBadge.classList.remove('hidden');
                showDashboard("Admin");
                fetchUserData("Admin");
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerText = "Logging in...";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "login",
                        username: username,
                        password: password
                    })
                });

                const result = await response.json();

                if (result.success) {
                    currentUsername = result.username;
                    adminBadge.classList.add('hidden');
                    showDashboard(currentUsername);
                    fetchUserData(currentUsername);
                } else {
                    showAlert('loginAlert', result.message || "Invalid username or password.");
                }
            } catch (err) {
                showAlert('loginAlert', "Network error or API not connected.");
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerText = "Login";
            }
        }

        function showDashboard(user) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            document.getElementById('userNameDisplay').innerText = `Welcome, ${user}`;
        }

        function handleLogout() {
            hideAlerts();
            currentUsername = "";
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('authSection').style.display = 'flex';
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();
        }

        // Create Folder
        async function createFolder() {
            const folderName = document.getElementById('newFolderName').value.trim();
            const createBtn = document.getElementById('createFolderBtn');

            if (!folderName) {
                alert("Please enter a folder name.");
                return;
            }

            createBtn.disabled = true;
            createBtn.innerText = "Creating...";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "createFolder",
                        username: currentUsername,
                        folderName: folderName
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert(`Folder "${folderName}" created successfully!`);
                    document.getElementById('newFolderName').value = "";
                    fetchUserData(currentUsername);
                } else {
                    alert(result.message || "Failed to create folder.");
                }
            } catch (err) {
                alert("Error connecting to server.");
            } finally {
                createBtn.disabled = false;
                createBtn.innerText = "Create Folder";
            }
        }

        // Upload File to Google Drive
        async function uploadFile() {
            const selectedFolder = document.getElementById('folderSelect').value;
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadFileBtn');

            if (!selectedFolder) {
                alert("Please select a target folder first.");
                return;
            }
            if (fileInput.files.length === 0) {
                alert("Please choose a file to upload.");
                return;
            }

            const file = fileInput.files[0];
            uploadBtn.disabled = true;
            uploadBtn.innerText = "Uploading to Drive...";

            const reader = new FileReader();
            reader.readAsDataURL(file);

            reader.onload = async function() {
                const base64Data = reader.result.split(',')[1];

                try {
                    const response = await fetch(API_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            action: "uploadFile",
                            username: currentUsername,
                            folderName: selectedFolder,
                            fileName: file.name,
                            mimeType: file.type,
                            fileData: base64Data
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        alert(`File "${file.name}" uploaded successfully to Google Drive!`);
                        fileInput.value = "";
                        fetchUserData(currentUsername);
                    } else {
                        alert(result.message || "Failed to upload file.");
                    }
                } catch (err) {
                    alert("Error uploading file.");
                } finally {
                    uploadBtn.disabled = false;
                    uploadBtn.innerText = "Upload File";
                }
            };
        }

        // Fetch User Data (Folders & Files) from Google Sheet
        async function fetchUserData(username) {
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "fetchUserData",
                        username: username
                    })
                });

                const result = await response.json();

                if (result.success) {
                    renderFolders(result.folders);
                    renderFiles(result.files);
                }
            } catch (err) {
                console.error("Error fetching data:", err);
            }
        }

        function renderFolders(folders) {
            const foldersContainer = document.getElementById('foldersContainer');
            const folderSelect = document.getElementById('folderSelect');

            foldersContainer.innerHTML = "";
            folderSelect.innerHTML = '<option value="">Select Target Folder</option>';

            if (!folders || folders.length === 0) {
                foldersContainer.innerHTML = "<p>No folders created yet.</p>";
                return;
            }

            folders.forEach(folderName => {
                const folderCard = document.createElement('div');
                folderCard.className = 'folder-card';
                folderCard.innerHTML = `<h3>📁 ${folderName}</h3>`;
                foldersContainer.appendChild(folderCard);

                const option = document.createElement('option');
                option.value = folderName;
                option.innerText = folderName;
                folderSelect.appendChild(option);
            });
        }

        function renderFiles(files) {
            const filesContainer = document.getElementById('filesContainer');
            filesContainer.innerHTML = "";

            if (!files || files.length === 0) {
                filesContainer.innerHTML = "<p>No documents uploaded yet.</p>";
                return;
            }

            files.forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <span>📄 <strong>${file.fileName}</strong> (Folder: ${file.folderName})</span>
                    <a href="${file.fileUrl}" target="_blank" class="view-btn">View / Download</a>
                `;
                filesContainer.appendChild(fileItem);
            });
        }
    </script>
</body>
</html>
